<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlipShop</title>

<style>

/* Body Background */

body{
    margin:0;
    font-family: Arial, sans-serif;
    background: linear-gradient(-45deg, #89f7fe, #66a6ff, #a18cd1, #fbc2eb);
    background-size: 400% 400%;
    animation: gradientMove 12s ease infinite;
}

@keyframes gradientMove {
    0% {background-position:0% 50%;}
    50% {background-position:100% 50%;}
    100% {background-position:0% 50%;}
}

/* Navbar */

.navbar{
    background: linear-gradient(90deg,#2874f0,#1c5ed6);
    color:white;
    padding:12px 25px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 4px 15px rgba(0,0,0,0.2);
    position:sticky;
    top:0;
}

.logo{
    font-size:24px;
    font-weight:bold;
    cursor:pointer;
}

/* Search */

.search-box{
    position:relative;
    width:40%;
}

.search-box input{
    width:100%;
    padding:10px 40px 10px 15px;
    border:none;
    border-radius:25px;
    outline:none;
}

.search-box span{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
}

/* Nav Links */

.nav-links{
    display:flex;
    gap:15px;
    align-items:center;
}

.nav-links button{
    background:white;
    color:#2874f0;
    border:none;
    padding:8px 16px;
    border-radius:20px;
    cursor:pointer;
    font-weight:bold;
    transition:0.3s;
}

.nav-links button:hover{
    background:#f0f0f0;
}

/* Cart */

.cart{
    cursor:pointer;
    font-weight:bold;
}

.badge{
    background:red;
    color:white;
    border-radius:50%;
    padding:3px 7px;
    font-size:12px;
    margin-left:5px;
}

/* Categories */

.categories{
    display:flex;
    justify-content:space-around;
    padding:20px;
    margin:20px;
    background:white;
    border-radius:12px;
    box-shadow:0 6px 18px rgba(0,0,0,0.15);
}

.cat{
    text-align:center;
    cursor:pointer;
    transition:0.3s;
}

.cat:hover{
    transform:translateY(-5px);
}

.cat img{
    width:60px;
}

/* Products */

.products{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
    gap:20px;
    padding:20px;
}

.card{
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(10px);
    padding:15px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 6px 18px rgba(0,0,0,0.15);
    transition:0.3s;
}

.card:hover{
    transform: translateY(-6px);
    box-shadow:0 12px 25px rgba(0,0,0,0.25);
}

.card img{
    width:100%;
    height:180px;
    object-fit:cover;
    border-radius:8px;
}

.price{
    color:green;
    font-weight:bold;
}

/* Buttons */

button.add{
    background:#ff9f00;
    border:none;
    padding:10px;
    width:100%;
    margin-top:10px;
    cursor:pointer;
    color:white;
    font-weight:bold;
    border-radius:6px;
    transition:0.3s;
}

button.add:hover{
    background:#fb641b;
}

.order-btn{
    background:#2874f0;
}

.order-btn:hover{
    background:#1c5ed6;
}
.card{
    transition:0.3s;
}


</style>
</head>

<body>

<!-- Navbar -->

<div class="navbar">

    <div class="logo">FlipShop</div>
    <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search for products..." onkeyup="searchProducts()">
</div>

    <div class="nav-links">
        <button onclick="window.location.href='login.html'">Login</button>
        <button onclick="window.location.href='signup.html'">Signup</button>
        <div class="cart" onclick="window.location.href='cart.html'">
            🛒 Cart <span class="badge" id="count">0</span>
        </div>
    </div>

</div>

<!-- Categories -->

<div class="categories">

    <div class="cat" onclick="window.location.href='mobile.html'">
        <img src="https://img.icons8.com/color/96/mobile.png">
        <p>Mobiles</p>
    </div>

    <div class="cat" onclick="window.location.href='electronics.html'">
        <img src="https://img.icons8.com/color/96/laptop.png">
        <p>Electronics</p>
    </div>

    <div class="cat" onclick="window.location.href='fashion.html'">
        <img src="https://img.icons8.com/color/96/t-shirt.png">
        <p>Fashion</p>
    </div>

    <div class="cat" onclick="window.location.href='shoes.html'">
        <img src="https://img.icons8.com/color/96/shoes.png">
        <p>Shoes</p>
    </div>

    <div class="cat" onclick="window.location.href='furniture.html'">
        <img src="https://img.icons8.com/color/96/sofa.png">
        <p>Furniture</p>
    </div>

</div>

<!-- Products -->

<div class="products">

    <div class="card">
        <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9">
        <h3>Smart Phone</h3>
        <p class="price">₹12,999</p>
        <button class="add" onclick="addCart()">Add to Cart</button>
        <button class="add order-btn" onclick="window.location.href='placeOrder.html'">Place Order</button>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1518444065439-e933c06ce9cd">
        <h3>Headphones</h3>
        <p class="price">₹1,499</p>
        <button class="add" onclick="addCart()">Add to Cart</button>
        <button class="add order-btn" onclick="window.location.href='placeOrder.html'">Place Order</button>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff">
        <h3>Running Shoes</h3>
        <p class="price">₹2,999</p>
        <button class="add" onclick="addCart()">Add to Cart</button>
        <button class="add order-btn" onclick="window.location.href='placeOrder.html'">Place Order</button>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1517336714731-489689fd1ca8">
        <h3>Laptop</h3>
        <p class="price">₹45,999</p>
        <button class="add" onclick="addCart()">Add to Cart</button>
        <button class="add order-btn" onclick="window.location.href='placeOrder.html'">Place Order</button>
    </div>

</div>

<script>

let count = 0;

function addCart(){
    count++;
    document.getElementById("count").innerText = count;
}
function searchProducts(){

    let input = document.getElementById("searchInput").value.toLowerCase();

    let cards = document.getElementsByClassName("card");

    for(let i = 0; i < cards.length; i++){

        let title = cards[i].getElementsByTagName("h3")[0].innerText.toLowerCase();

        if(title.includes(input)){
            cards[i].style.display = "block";
        }else{
            cards[i].style.display = "none";
        }

    }
}

</script>
</body>
</html>
