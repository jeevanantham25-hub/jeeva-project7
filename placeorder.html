<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout</title>

<style>

body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#f1f3f6;
}

/* Navbar */

.navbar{
    background:#2874f0;
    color:white;
    padding:12px 20px;
    font-size:20px;
    font-weight:bold;
}

/* Layout */

.container{
    display:flex;
    gap:20px;
    padding:20px;
}

/* Address */

.box{
    background:white;
    padding:20px;
    border-radius:5px;
    margin-bottom:20px;
}

input, textarea, select{
    width:100%;
    padding:10px;
    margin-top:10px;
    border:1px solid #ccc;
    border-radius:4px;
}

/* Price */

.price-box{
    background:white;
    padding:20px;
    border-radius:5px;
    height:fit-content;
}

/* Button */

.place-btn{
    background:#fb641b;
    color:white;
    border:none;
    padding:12px;
    width:100%;
    font-size:16px;
    cursor:pointer;
    border-radius:4px;
    margin-top:15px;
}

.place-btn:hover{
    background:#e85a19;
}

.success{
    display:none;
    text-align:center;
    background:white;
    padding:40px;
    margin:20px;
    border-radius:5px;
}

</style>
</head>

<body>

<div class="navbar">Checkout</div>

<div class="container">

    <!-- Left Section -->
    <div style="flex:2">

        <!-- Address -->
        <div class="box">
            <h3>Delivery Address</h3>

            <input type="text" placeholder="Full Name">
            <input type="text" placeholder="Mobile Number">
            <textarea placeholder="Address"></textarea>
            <input type="text" placeholder="City">
            <input type="text" placeholder="Pincode">

        </div>

        <!-- Payment -->
        <div class="box">
            <h3>Payment Method</h3>

            <label><input type="radio" name="pay"> Cash on Delivery</label><br>
            <label><input type="radio" name="pay"> UPI</label><br>
            <label><input type="radio" name="pay"> Credit / Debit Card</label>

        </div>

    </div>

    <!-- Right Section -->
    <div class="price-box" style="flex:1">

        <h3>Order Summary</h3>
        <hr>

        <p>Product: Smart Phone</p>
        <p>Price: ₹12,999</p>
        <p>Delivery: Free</p>

        <hr>

        <h2>Total: ₹12,999</h2>

        <button class="place-btn" onclick="placeOrder()">Place Order</button>

    </div>

</div>

<!-- Success Message -->

<div class="success" id="success">
    <h2>✅ Order Placed Successfully!</h2>
    <p>Thank you for shopping with us.</p>
</div>

<script>

function placeOrder(){

    document.querySelector(".container").style.display = "none";
    document.getElementById("success").style.display = "block";

}

</script>

</body>
</html>
