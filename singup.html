<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signup Page</title>

<style>

body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#2874f0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Container */

.container{
    display:flex;
    width:750px;
    background:white;
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 4px 20px rgba(0,0,0,0.2);
}

/* Left */

.left{
    background:#2874f0;
    color:white;
    padding:40px;
    width:50%;
}

.left h2{
    margin-top:0;
}

/* Right */

.right{
    padding:40px;
    width:50%;
}

.input-box{
    margin-bottom:18px;
}

.input-box input{
    width:100%;
    padding:10px;
    border:none;
    border-bottom:1px solid #ccc;
    outline:none;
    font-size:15px;
}

button{
    width:100%;
    padding:12px;
    background:#fb641b;
    border:none;
    color:white;
    font-size:16px;
    cursor:pointer;
    border-radius:4px;
}

button:hover{
    background:#e85a19;
}

.link{
    margin-top:15px;
    text-align:center;
}

.link a{
    text-decoration:none;
    color:#2874f0;
    font-weight:bold;
}

.show{
    cursor:pointer;
    font-size:13px;
    color:#2874f0;
}

</style>
</head>

<body>

<div class="container">

    <div class="left">
        <h2>Sign Up</h2>
        <p>Create your account to start shopping with us.</p>
    </div>

    <div class="right">

        <div class="input-box">
            <input type="text" placeholder="Full Name">
        </div>

        <div class="input-box">
            <input type="email" placeholder="Email Address">
        </div>

        <div class="input-box">
            <input type="text" placeholder="Mobile Number">
        </div>

        <div class="input-box">
            <input type="password" id="password" placeholder="Password">
            <span class="show" onclick="togglePassword()">Show</span>
        </div>

        <div class="input-box">
            <input type="password" id="confirm" placeholder="Confirm Password">
        </div>

        <button onclick="signup()">Create Account</button>

        <div class="link">
            <p>Already have an account? <a href="login.html">Login</a></p>
        </div>

    </div>

</div>

<script>

function togglePassword(){
    let pass = document.getElementById("password");
    pass.type = pass.type === "password" ? "text" : "password";
}

function signup(){
    alert("Account Created Successfully!");
}

</script>

</body>
</html>
